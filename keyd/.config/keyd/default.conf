# ===========================================================================
# REFERENCE COPY -- THIS FILE IS NOT LIVE
# ===========================================================================
# keyd only reads /etc/keyd/. It is a root daemon that grabs input devices at
# boot, so it cannot read anything under ~/.config. This copy exists so the
# config lives with the rest of your setup and survives a reinstall.
#
# The LIVE file is:  /etc/keyd/default.conf
#
# ---------------------------------------------------------------------------
# FULL RESTORE after a reinstall (all four steps -- installing the file alone
# is not enough, keyd must be installed and its service enabled):
#
#   1. omarchy pkg add keyd
#   2. sudo install -Dm644 ~/.config/keyd/default.conf /etc/keyd/default.conf
#   3. sudo systemctl enable --now keyd
#   4. journalctl -u keyd -n 20      # confirm it matched the KEYBOARD only
#
# Step 4 matters. The [ids] line below pins one exact interface. If the log
# shows keyd matching "Deco LW Pen", stop it (sudo systemctl stop keyd) -- a
# matched pen breaks pen movement. Re-pair the tablet over Bluetooth first;
# pairing lives in /var/lib/bluetooth, not in ~/.config.
#
# If the id ever stops matching (new tablet, re-pairing changed it), get the
# current one from:  sudo keyd monitor    then update the [ids] line.
# ---------------------------------------------------------------------------
# EDITING: after changing this file, push it live with:
#   sudo install -Dm644 ~/.config/keyd/default.conf /etc/keyd/default.conf
#   sudo systemctl restart keyd
#
# To pull the live file back into here:
#   sudo cp /etc/keyd/default.conf ~/.config/keyd/default.conf
#   sudo chown $USER: ~/.config/keyd/default.conf
#
# Do NOT symlink /etc/keyd/default.conf to this file. keyd's command() action
# runs as the keyd user (root), so a root daemon reading a user-writable
# config is a privilege-escalation risk.
# ===========================================================================

# XP-Pen Deco LW -- express key remapping (Bluetooth only)
#
# Targets the Bluetooth KEYBOARD interface by its exact device id. The pen and
# mouse interfaces share 28bd:0935 but have different full ids, so listing the
# keyboard exactly keeps keyd away from the pen (matching 28bd:0935 broadly
# grabs the pen and breaks it).
#
# Over the USB cable this interface does not exist, so this file does nothing.
#
# ---------------------------------------------------------------------------
# The tablet is mounted ROTATED 180 degrees (express keys on the right), so the
# physical top button is the tablet's internal button 8. This table is written
# in the order you actually see them, TOP to BOTTOM:
#
#   position   tablet sends      you get
#   top   (1)  ctrl+kpminus  ->  p            freedraw
#         (2)  ctrl+kpplus   ->  e            eraser
#         (3)  ctrl+z        ->  alt (held)   duplicate-drag
#         (4)  ctrl+s        ->  space        pan
#         (5)  space         ->  ctrl+s       save
#         (6)  leftalt       ->  ctrl+z       undo
#         (7)  e             ->  ctrl+kpplus  zoom in
#   bottom(8)  b             ->  1
#
# TO CHANGE A KEY: edit the right-hand side of a line below, then run
#   sudo systemctl restart keyd
#
# Use restart, NOT "keyd reload" -- reload does not always re-grab the device
# and the change may appear not to take.
# Validate first with:  sudo keyd check
# Valid key names:      keyd list-keys
# Modifier syntax:  C- = ctrl, A- = alt, S- = shift, M- = super
#   e.g.  space = C-S-z     makes that button send Ctrl+Shift+Z
# ---------------------------------------------------------------------------

[ids]

28bd:0935:6a866911

[main]

# The tablet's Ctrl only ever arrives as part of a Ctrl+X express key, so
# suppress it and map the second key directly. This is what lets position 3
# emit a real HELD Alt (needed for drag) instead of a tap.
leftcontrol = noop

# --- top to bottom ---
kpminus = p
kpplus  = e
z       = layer(alt)
s       = space
space   = C-s
leftalt = C-z
e       = C-kpplus
b       = 1
